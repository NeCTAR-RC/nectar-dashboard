---
features:
  - |
    Added a new ``nectar_dashboard.sentry`` module that enables error
    reporting to a Sentry compatible service such as GlitchTip. Call
    ``nectar_dashboard.sentry.setup(dsn, environment)`` from a settings
    snippet to enable it. It is a no-op when no DSN is configured, and
    it never raises, so it is safe to call while Horizon loads its
    ``local_settings.d`` snippets.
