"admin-grant": "role:admin and rule:admin_role_target"
"admin_or_monitoring": "rule:admin_required or rule:read_only or rule:cloud_admin or rule:system_reader"
"admin_role_target": "'tenantmanager':%(target.role.name)s or 'member':%(target.role.name)s or 'helpdesk':%(target.role.name)s or 'monitoring':%(target.role.name)s or 'read_only':%(target.role.name)s or 'reader':%(target.role.name)s or 'allocationadmin':%(target.role.name)s or 'allocationapprover':%(target.role.name)s or 'monash-rgw':%(target.role.name)s or 'monash-rgw-test':%(target.role.name)s or 'monash-sscale':%(target.role.name)s or 'bot_user':%(target.role.name)s or 'beta_tester':%(target.role.name)s or 'auckland-access':%(target.role.name)s or 'tas-s-access':%(target.role.name)s or 'uom-access':%(target.role.name)s or 'sut-access':%(target.role.name)s or 'reselleradmin':%(target.role.name)s or 'heat_stack_user':%(target.role.name)s"
"cloud_admin": "role:cloud_admin"
"domain_scoped": "domain_id:%(target.domain_id)s or domain_id:%(target.user.domain_id)s or domain_id:%(target.project.domain_id)s"
"identity:create_endpoint": "role:nectar_role_admin"
"identity:create_grant": "rule:provisioner-grant or rule:tenantmanager_project-grant or rule:rr-grant or rule:admin-grant or role:nectar_role_admin"
"identity:create_implied_role": "role:nectar_role_admin"
"identity:create_project": "rule:provisioner or rule:rr-role-admin"
"identity:create_region": "role:nectar_role_admin"
"identity:create_role": "role:nectar_role_admin"
"identity:create_user": "rule:provisioner or rule:rr-role-admin"
"identity:delete_endpoint": "role:nectar_role_admin"
"identity:delete_implied_role": "role:nectar_role_admin"
"identity:delete_project": "rule:provisioner or rule:rr-role-admin"
"identity:delete_region": "role:nectar_role_admin"
"identity:delete_role": "role:nectar_role_admin"
"identity:delete_user": "rule:provisioner or rule:rr-role-admin"
"identity:get_domain": "rule:admin_required or project_domain_id:%(target.domain.id)s or rule:provisioner or rule:restricted-role-admin-roles"
"identity:get_project": "rule:admin_or_monitoring or project_id:%(target.project.id)s or rule:rr-admin"
"identity:get_user": "rule:admin_or_monitoring or rule:owner or rule:rr-admin"
"identity:list_domains": "rule:admin_required or rule:restricted-role-admin-roles"
"identity:list_projects": "rule:admin_or_monitoring or rule:tenant_manage_project or rule:rr-admin"
"identity:list_role_assignments": "rule:admin_or_monitoring or project_id:%(filter_attr.scope.project.id)s or rule:rr-admin"
"identity:list_roles": "rule:admin_or_monitoring or rule:tenantmanager or rule:restricted-admin-roles"
"identity:list_user_projects": "rule:admin_or_monitoring or rule:owner"
"identity:list_users": "rule:admin_or_monitoring or rule:rr-admin"
"identity:revoke_grant": "rule:provisioner-grant or rule:tenantmanager_project-grant or rule:rr-grant or rule:admin-grant or role:nectar_role_admin"
"identity:update_endpoint": "role:nectar_role_admin"
"identity:update_project": "rule:provisioner or role:cloud_admin or rule:rr-role-admin"
"identity:update_region": "role:nectar_role_admin"
"identity:update_role": "role:nectar_role_admin"
"identity:update_user": "rule:provisioner or rule:rr-role-admin or role:admin"
"provisioner": "role:provisioner"
"provisioner-grant": "role:provisioner and rule:provisioner_role_target"
"provisioner_role_target": "'tenantmanager':%(target.role.name)s or 'member':%(target.role.name)s or 'reservation_bot':%(target.role.name)s"
"read_only": "role:monitoring or role:read_only or role:helpdesk or rule:system_reader"
"restricted-admin-roles": "role:restricted-qld-admin or role:restricted-auckland-admin"
"restricted-role-admin-roles": "role:restricted-qld-role-admin or role:restricted-auckland-role-admin"
"restricted_admin_role_target": "(role:restricted-qld-role-admin and 'restricted-qld-admin':%(target.role.name)s) or (role:restricted-auckland-role-admin and 'restricted-auckland-admin':%(target.role.name)s)"
"restricted_role_target": "(role:restricted-qld-admin and ('restricted-qld-member':%(target.role.name)s or 'restricted-qld-reader':%(target.role.name)s)) or (role:restricted-auckland-admin and ('restricted-auckland-member':%(target.role.name)s or 'restricted-auckland-reader':%(target.role.name)s))"
"rr-admin": "rule:restricted-admin-roles and rule:domain_scoped"
"rr-admin-grant": "rule:rr-admin and rule:restricted_role_target"
"rr-grant": "rule:rr-admin-grant or rule:rr-role-admin-grant"
"rr-role-admin": "rule:restricted-role-admin-roles and rule:domain_scoped"
"rr-role-admin-grant": "rule:rr-role-admin and rule:restricted_admin_role_target"
"system_reader": "(role:reader and system_scope:all)"
"tenant_manage_project": "role:tenantmanager and project_id:%(target.project.id)s"
"tenantmanager": "role:tenantmanager"
"tenantmanager_project-grant": "role:tenantmanager and project_id:%(target.project.id)s and rule:tenantmanager_role_target"
"tenantmanager_role_target": "'member':%(target.role.name)s or 'tenantmanager':%(target.role.name)s"
